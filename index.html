<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Bolinhas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Jogo de Bolinhas</h1>
        <div class="game-info">
            <div class="score">Pontuação: <span id="score">0</span></div>
            <div class="level">Nível: <span id="level">1</span></div>
        </div>
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
            <div id="gameMessages" class="game-messages">
                <p>Clique em "Iniciar Jogo" para começar</p>
            </div>
        </div>
        <div class="controls">
            <p>Controles: Use as setas do teclado ou WASD para mover a bolinha</p>
            <button id="startButton">Iniciar Jogo</button>
            <button id="pauseButton">Pausar</button>
        </div>
    </div>
    <script src="js/game.js"></script>
</body>
</html>
